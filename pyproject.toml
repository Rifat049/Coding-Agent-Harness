[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebenchkit"
version = "0.2.0"
description = "Wrap a code model in independent checks: hidden tests, cheat flags, pass rate, runtime and invalid-output rate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # standard library only
license = { text = "MIT" }

[project.scripts]
codebenchkit = "codebenchkit.cli:main"

[tool.setuptools.packages.find]
include = ["codebenchkit*"]
